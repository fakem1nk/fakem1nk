<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
.b1{animation:d1 18s ease-in-out infinite}
.b2{animation:d2 22s ease-in-out infinite}
.b3{animation:d3 26s ease-in-out infinite}
@keyframes d1{50%{transform:translate(220px,70px)}}
@keyframes d2{50%{transform:translate(-240px,-60px)}}
@keyframes d3{50%{transform:translate(120px,-90px)}}
.r{animation:rise 1.4s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-origin:420px 352px}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
</style>
<defs>
<clipPath id="c"><rect width="1200" height="420" rx="32"/></clipPath>
<filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="80"/></filter>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
<stop offset="0" stop-color="#d2d2d7"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#d2d2d7"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-700 0;1500 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#bf5af2"/>
</linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="420" fill="#000"/>
<g filter="url(#blur)" opacity=".55">
<circle class="b1" cx="230" cy="110" r="190" fill="#0071e3"/>
<circle class="b2" cx="980" cy="320" r="210" fill="#bf5af2"/>
<circle class="b3" cx="620" cy="460" r="170" fill="#30d5c8"/>
</g>
<rect width="1200" height="420" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2" rx="32"/>
<text class="r" x="600" y="118" text-anchor="middle" font-size="26" font-weight="500" fill="#a1a1a6">Привет, я</text>
<text class="r" style="animation-delay:.15s" x="600" y="226" text-anchor="middle" font-size="124" font-weight="700" letter-spacing="-5" fill="url(#shine)">fakem1nk</text>
<text x="600" y="290" text-anchor="middle" font-size="34" font-weight="600" letter-spacing="-.5">
<tspan class="r" style="animation-delay:.5s" fill="#f5f5f7">Сети. </tspan><tspan class="r" style="animation-delay:.75s" fill="#f5f5f7">Linux. </tspan><tspan class="r" style="animation-delay:1s" fill="url(#accent)">Автоматизация.</tspan>
</text>
<g class="r" style="animation-delay:1.3s">
<rect x="400" y="330" width="400" height="44" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
<circle class="pulse" cx="420" cy="352" r="5" fill="#30d158"/>
<circle cx="420" cy="352" r="5" fill="#30d158"/>
<text x="612" y="358" text-anchor="middle" font-size="17" font-weight="500" fill="#f5f5f7">Открыт к работе · DevOps · Remote</text>
</g>
</g>
</svg>
